<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的学习计划</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">📚 每日学习计划</div>
      <div class="user-info">
        <span id="userName" class="user-name"></span>
        <span id="userMeta" class="user-meta"></span>
        <button id="logout" class="btn btn-ghost">退出</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="panel-head">
        <h2>📅 我的时间安排</h2>
        <div class="head-actions">
          <button id="regenBtn" class="btn btn-ghost btn-sm" title="按长期目标和历史习惯重新生成当天任务">⟳ 重新生成</button>
          <input type="date" id="datePicker" class="date-input">
        </div>
      </div>
      <p class="panel-sub">系统会根据长期目标和历史习惯自动生成当天计划；手动修改或删除的计划不会被自动恢复。</p>

      <div id="summary" class="summary"></div>

      <div class="add-plan">
        <h3 id="addFormTitle">＋ 添加时间段计划</h3>
        <div id="editHint" class="edit-hint hidden">
          <span id="editHintText"></span>
          <button id="cancelEdit" class="btn btn-ghost btn-sm" type="button">取消编辑</button>
        </div>
        <div class="add-grid">
          <div class="field">
            <label>开始时间</label>
            <input type="time" id="startTime">
          </div>
          <div class="field">
            <label>结束时间</label>
            <input type="time" id="endTime">
          </div>
          <div class="field field-grow">
            <label>计划内容</label>
            <input type="text" id="description" placeholder="例如：背英语单词 30 分钟">
          </div>
          <button id="addBtn" class="btn btn-primary btn-add">添加</button>
        </div>
        <div id="formError" class="error"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>🗓️ 24 小时计划表</h2>
      </div>
      <div id="timeline" class="timeline"></div>
      <div id="planList" class="plan-list"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>🎯 长期目标</h2>
        <span class="hint">设定时间范围，系统自动安排每日学习计划</span>
      </div>

      <div class="goal-form">
        <h3 id="goalFormTitle">＋ 新建长期目标</h3>
        <div id="goalEditHint" class="edit-hint hidden">
          <span id="goalEditHintText"></span>
          <button id="goalCancelEdit" class="btn btn-ghost btn-sm" type="button">取消编辑</button>
        </div>

        <div class="form-grid">
          <div class="field field-grow">
            <label>目标名称</label>
            <input type="text" id="goalTitle" placeholder="例如：通过英语六级">
          </div>
          <div class="field field-grow">
            <label>每日任务</label>
            <input type="text" id="goalDailyTask" placeholder="留空则使用目标名称">
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>开始日期</label>
            <input type="date" id="goalStartDate">
          </div>
          <div class="field">
            <label>结束日期</label>
            <input type="date" id="goalEndDate">
          </div>
          <div class="field">
            <label>每日开始</label>
            <input type="time" id="goalStartTime">
          </div>
          <div class="field">
            <label>每日结束</label>
            <input type="time" id="goalEndTime">
          </div>
        </div>

        <div class="field">
          <label>执行日（可多选）</label>
          <div class="day-chips" id="goalWeekdayChips">
            <label class="day-chip"><input type="checkbox" value="0">一</label>
            <label class="day-chip"><input type="checkbox" value="1">二</label>
            <label class="day-chip"><input type="checkbox" value="2">三</label>
            <label class="day-chip"><input type="checkbox" value="3">四</label>
            <label class="day-chip"><input type="checkbox" value="4">五</label>
            <label class="day-chip"><input type="checkbox" value="5">六</label>
            <label class="day-chip"><input type="checkbox" value="6">日</label>
          </div>
        </div>

        <p class="hint">系统会从今天起，在范围内的每个执行日按上述时段生成每日计划；与已有计划冲突的日期会跳过。</p>
        <div id="goalError" class="error"></div>
        <button id="goalAddBtn" class="btn btn-primary btn-add">添加长期目标</button>
      </div>

      <div id="goalList" class="goal-list"></div>
    </section>

  </main>

  <div id="postponeModal" class="modal-overlay hidden">
    <div class="modal modal-postpone">
      <div class="modal-icon">📅</div>
      <h3 class="modal-title">延顺任务</h3>
      <p id="postponeText" class="modal-text"></p>
      <div class="postpone-fields">
        <div class="field">
          <label>新日期</label>
          <input type="date" id="postponeDate">
        </div>
        <div class="field">
          <label>开始时间</label>
          <input type="time" id="postponeStart">
        </div>
        <div class="field">
          <label>结束时间</label>
          <input type="time" id="postponeEnd">
        </div>
      </div>
      <div id="postponeError" class="error"></div>
      <div class="modal-actions">
        <button id="postponeCancel" class="btn btn-ghost">取消</button>
        <button id="postponeConfirm" class="btn btn-primary">确认延顺</button>
      </div>
    </div>
  </div>

  <div id="reminderModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-icon">⏰</div>
      <h3 class="modal-title">计划时间到了</h3>
      <p id="reminderText" class="modal-text"></p>
      <div class="modal-actions">
        <button id="reminderDismiss" class="btn btn-ghost">我知道了</button>
        <button id="reminderStart" class="btn btn-primary">▶ 开始计划</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/static/js/schedule.js"></script>
</body>
</html>
